name: Deploy Vite Project to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FEDF-project/package-lock.json

      - name: Install dependencies
        working-directory: ./FEDF-project
        run: npm ci

      - name: Build project
        working-directory: ./FEDF-project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./FEDF-project/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4